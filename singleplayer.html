<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Streetle – Singleplayer</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body class="page-game">

  <header class="header">
    <h1 class="title">Streetle</h1>
    <a href="index.html" class="btn-back">← Zurück</a>
  </header>

  <main class="container">

    <section id="game" class="game-layout">
      <div id="map" class="map"></div>

      <div class="sidebar">
        <p id="roundInfo">Runde 1 von 5</p>
        <p id="scoreInfo">Punkte: 0</p>
        <p id="timer">01:00</p>

        <input id="guessInput" class="input" placeholder="Straßenname eingeben…" autocomplete="off">
        <div id="suggestions" class="dropdown"></div>

        <button id="btnGuess" class="btn-outline">Raten</button>
        <button id="btnHint1" class="btn-outline">Hinweis 1 (−100 Pkt)</button>
        <button id="btnHint2" class="btn-outline">Hinweis 2 (−200 Pkt)</button>

        <div id="feedback" class="feedback"></div>
        <button id="btnNext" class="btn-outline" style="display:none;">Nächste Runde →</button>
      </div>
    </section>

    <!-- Endscreen -->
    <section id="endscreen" class="block" style="display:none; text-align:center; margin-top:40px;">
      <h2 class="block-title">Spiel beendet!</h2>
      <p id="finalScore" style="font-size:24px; margin:16px 0;"></p>
      <button onclick="window.location.href='index.html'" class="btn-outline">Nochmal spielen</button>
    </section>

  </main>

  <script type="module" src="js/singleplayer.js"></script>

</body>
</html>
